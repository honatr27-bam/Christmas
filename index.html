<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merry Christmas 2026</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage {
    position: relative;
    width: min(100vw, calc(100dvh * 25 / 27));
    aspect-ratio: 25 / 27;
    margin: 0 auto;
    background: #050912;
    cursor: pointer;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .clock {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 14px;
    display: flex; align-items: center; gap: 6px;
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color: #e8a24a;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
  .hint {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 14px;
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    color: #8d9bb5;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
  .clock i { width: 5px; height: 5px; border-radius: 50%; background: #e8a24a; }
</style>
</head>
<body>
<main class="stage" id="stage" title="Nhấn để bật hoặc tắt nhạc">
  <canvas id="cv" role="img" aria-label="Cây thông Noel ASCII mọc dần dưới bầu trời sao, kèm dòng chữ Merry Christmas 2026"></canvas>
  <div class="hint" id="hint">♪ nhấn để bật nhạc</div>
  <div class="clock"><i></i><span id="clk">t 00.00s</span></div>
</main>
 <audio id="bgMusic" src="Christmas.mp4" preload="auto"></audio>

<script>
const FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';
const COLS = 100, ROWS = 72, MID = 50, BASE = 54, GROUND = 53, LOOP = 20;
const BG = '#050912';
const GREENS = ['#2e9e47', '#3dbb58', '#1f7a36', '#69cf79', '#2a8a3f', '#15602b'];
const POOL = 'oxv^%&#@W+-~oxv%&x';
const GOLD = '#e8c340', RED = '#dc3a3e', BLUE = '#3f68d8', WHITE = '#e6ebf3';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const clk = document.getElementById('clk');
let cw, ch;

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  cw = cv.width / COLS;
  ch = cv.height / ROWS;
  ctx.font = (ch * 0.92) + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
}

// Số ngẫu nhiên xác định theo (a, b, c) để cảnh giống nhau mỗi lần chạy
function h(a, b, c) {
  let x = Math.imul(a + 1, 374761393) ^ Math.imul(b + 1, 668265263) ^ Math.imul((c | 0) + 1, 2147483647);
  x = Math.imul(x ^ (x >>> 13), 1274126177);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
const ease = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };

function cell(c, r, s, col, al, clear) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  if (clear) { ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(c * cw, r * ch, cw + 0.5, ch + 0.5); }
  ctx.globalAlpha = al;
  ctx.fillStyle = col;
  ctx.fillText(s, (c + 0.5) * cw, (r + 0.5) * ch);
}

/* ---------- Dữ liệu cố định ---------- */
const STARS = Array.from({ length: 260 }, (_, i) => ({
  c: Math.floor(h(i, 1, 50) * COLS),
  r: Math.floor(h(i, 2, 50) * (ROWS - 2)),
  ap: h(i, 3, 50) < 0.25 ? 0 : h(i, 3, 51) * 9,
  ph: h(i, 4, 50) * 6.28,
  sp: 0.8 + h(i, 5, 50) * 2.5,
  ch: '+.*x+'[Math.floor(h(i, 6, 50) * 5)],
  br: 0.5 + 0.5 * h(i, 7, 50)
}));
const SNOW = Array.from({ length: 70 }, (_, i) => ({
  c: h(i, 1, 60) * COLS, r: h(i, 2, 60) * ROWS,
  sp: 1.5 + h(i, 3, 60) * 2.5, ph: h(i, 4, 60) * 6.28,
  ch: '*.+'[Math.floor(h(i, 5, 60) * 3)]
}));
const BANDS = [
  { f: 0.16, s: 0.10, t: 5.8 }, { f: 0.33, s: -0.10, t: 6.8 }, { f: 0.54, s: 0.10, t: 8.2 },
  { f: 0.70, s: -0.10, t: 9.2 }, { f: 0.86, s: 0.08, t: 10.4 }
];
const ORN_COLS = [RED, RED, GOLD, BLUE];
const ORNS = Array.from({ length: 16 }, (_, i) => ({
  f: 0.12 + 0.78 * h(i, 1, 40), dx: (h(i, 2, 40) * 2 - 1) * 0.7,
  t: 8.4 + i * 0.38, col: ORN_COLS[i % 4]
}));
const GIFTS = [
  { c0: 20, c1: 27, r0: 53, r1: 56, col: BLUE, rb: GOLD, t: 10.6 },
  { c0: 29, c1: 40, r0: 54, r1: 59, col: RED, rb: GOLD, t: 11.1 },
  { c0: 56, c1: 62, r0: 54, r1: 57, col: RED, rb: GOLD, t: 11.6 },
  { c0: 63, c1: 72, r0: 53, r1: 59, col: BLUE, rb: WHITE, t: 12.0 },
  { c0: 72, c1: 80, r0: 54, r1: 57, col: GOLD, rb: WHITE, t: 12.4 }
];
const MSG = (() => {
  const words = ['MERRY', 'CHRISTMAS', '2026'], out = [];
  let pos = 0;
  words.forEach((w, wi) => {
    [...w].forEach((ltr, li) => {
      const col = wi === 0 ? '#d9454a' : wi === 2 ? GOLD : [RED, GOLD, '#3dbb58'][li % 3];
      out.push({ ltr, pos, col }); pos += 2;
    });
    pos += 2;
  });
  const total = pos - 4;
  const start = Math.round(MID - total / 2);
  out.forEach(o => o.c = start + o.pos);
  return out;
})();

/* ---------- Hình dạng cây ---------- */
function shape(t) {
  const a = ease((t - 2.4) / 1.6), b = ease((t - 4) / 4);
  return { H: 17 * a + 24 * b, W: 28 * ease((t - 2.4) / 1.4), k: 1 - b };
}
function halfW(f, W, k, r) {
  const tri = 1 - f, dome = Math.sqrt(Math.max(0, 1 - f * f));
  return W * ((1 - k) * tri + k * dome) * (1 + 0.07 * (1 - k) * Math.sin(r * 0.85));
}

/* ---------- Vẽ một khung hình ---------- */
function draw(t) {
  ctx.globalAlpha = 1;
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Mặt đất: chấm rồi các vạch thưa dần về phía gần
  const gAl = ease(t / 0.8);
  for (let r = GROUND; r < ROWS; r++) {
    const g = r - GROUND, p = 2 + Math.floor(Math.max(0, g - 3) / 4);
    for (let c = 0; c < COLS; c++) {
      if (g < 3) { if (c % 2 === 0) cell(c, r, '.', '#6b7c9c', 0.2 * gAl); }
      else if ((c + (g % 2)) % p === 0) cell(c, r, '-', '#6b7c9c', (0.12 + g * 0.006) * gAl);
    }
  }

  // Sao
  for (const s of STARS) {
    const al = ease((t - s.ap) / 0.6) * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph))) * s.br;
    if (al > 0.02) cell(s.c, s.r, s.ch, s.br > 0.8 ? WHITE : '#8d9bb5', al);
  }

  // Tuyết rơi
  const sa = ease((t - 4.5) / 2) * 0.7;
  if (sa > 0) for (const f of SNOW) {
    const r = (f.r + Math.max(0, t - 4.5) * f.sp) % ROWS;
    cell(Math.round(f.c + Math.sin(t * 0.7 + f.ph) * 1.5), Math.floor(r), f.ch, WHITE, sa);
  }

  // Cây
  const { H, W, k } = shape(t);
  if (H > 0.5) {
    const top = Math.floor(BASE - H);
    for (let r = top; r <= BASE; r++) {
      const f = (BASE - r) / H, w = halfW(f, W, k, r);
      if (w < 0.5) continue;
      for (let c = Math.ceil(MID - w); c <= MID + w; c++) {
        const d = Math.abs(c - MID) / w;
        if (d > 0.8 && h(c, r, 7) < (d - 0.8) * 4.5) continue;
        const bucket = h(c, r, 3) < 0.3 ? Math.floor(t * 6) : 0;
        let s = POOL[Math.floor(h(c, r, bucket + 11) * POOL.length)];
        let col, al = 0.55 + 0.45 * h(c, r, 5);
        if (f > 0.8 && k > 0.4) col = '#d9dde6';
        else col = h(c, r, 9) < 0.07 ? WHITE : GREENS[Math.floor(h(c, r, 13) * GREENS.length)];
        // Dây đèn vàng quét từ trái sang phải
        for (const b of BANDS) {
          const p = ease((t - b.t) / 1.4);
          if (p > 0 && Math.abs(r - (BASE - b.f * H + (c - MID) * b.s)) < 1.3 && (c - (MID - w)) / (2 * w) < p) {
            col = h(c, r, 17) < 0.3 ? '#f4dc7a' : GOLD;
            s = '@%#&'[Math.floor(h(c, r, 19) * 4)];
            al = 0.9;
          }
        }
        cell(c, r, s, col, al, true);
      }
    }
    // Thân cây
    if (t > 3.2) for (let r = BASE + 1; r <= BASE + 3; r++)
      for (let c = MID - 1; c <= MID + 1; c++)
        cell(c, r, h(c, r, 21) < 0.5 ? 'x' : '%', '#b3402e', 0.5, true);

    // Quả châu
    for (let i = 0; i < ORNS.length; i++) {
      const o = ORNS[i];
      if (t < o.t) continue;
      const p = ease((t - o.t) / 0.6), pulse = 0.75 + 0.25 * Math.sin(t * 3 + i);
      const cc = Math.round(MID + o.dx * halfW(o.f, W, k, 0)), rr = Math.round(BASE - o.f * H);
      for (let dr = 0; dr < 2; dr++) for (let dc = -1; dc <= 1; dc++)
        cell(cc + dc, rr + dr, '%&@'[Math.floor(h(cc + dc, rr + dr, 23) * 3)], o.col, p * pulse, true);
    }
  }

  // Hộp quà
  for (const g of GIFTS) {
    const p = ease((t - g.t) / 0.8);
    if (p <= 0) continue;
    const rows = g.r1 - g.r0 + 1, cMid = Math.round((g.c0 + g.c1) / 2);
    for (let r = g.r0; r <= g.r1; r++) {
      if ((g.r1 - r) / rows >= p) continue;
      for (let c = g.c0; c <= g.c1; c++) {
        const ribbon = c === cMid || r === g.r0 + 1;
        cell(c, r, ribbon ? '@' : '#', ribbon ? g.rb : g.col, 0.9, true);
      }
    }
  }

  // Ngôi sao và tia sáng trên đỉnh
  if (t > 9) {
    const p = ease((t - 9) / 0.8), pulse = 0.8 + 0.2 * Math.sin(t * 4);
    const sr = Math.floor(BASE - 41) + 2;
    const pts = [[0, -2, '#'], [-2, -1, '@'], [-1, -1, '@'], [0, -1, '@'], [1, -1, '@'], [2, -1, '@'],
      [-2, 0, '@'], [-1, 0, '@'], [0, 0, '@'], [1, 0, '@'], [2, 0, '@'], [-1, 1, '@'], [0, 1, '@'], [1, 1, '@'],
      [0, 2, '+'], [-4, 1, '*'], [4, 1, '*']];
    for (const [dc, dr, s] of pts) cell(MID + dc, sr + dr, s, '#f1cf4a', p * pulse, true);
    if (t > 11) {
      const ra = ease((t - 11) / 1.5);
      for (const kk of [-3, -1, 1, 3]) for (let i = 1; i <= 8; i++) {
        const fl = 0.6 + 0.4 * Math.sin(t * 5 + i * 1.7 + kk);
        cell(Math.round(MID + kk * i * 0.25), sr - 2 - i, kk < 0 ? '\\' : kk > 0 ? '/' : '|',
          '#d9c38a', 0.35 * (1 - i / 9) * fl * ra);
      }
    }
  }

  // Lời chúc
  MSG.forEach((m, i) => {
    const p = ease((t - 16.3 - i * 0.1) / 0.5);
    if (p > 0) cell(m.c, 69, m.ltr, m.col, 0.85 * p);
  });

  ctx.globalAlpha = 1;
  clk.textContent = 't ' + t.toFixed(2).padStart(5, '0') + 's';
}

/* ---------- Chạy ---------- */
const bgm = document.getElementById('bgm');
const hint = document.getElementById('hint');
let t0 = performance.now(), started = false;
const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Lần nhấn đầu: bật nhạc và chạy lại từ đầu cho khớp hình. Các lần sau: tắt/bật tiếng.
stage.addEventListener('pointerdown', () => {
  if (!started) {
    bgm.currentTime = 0;
    bgm.muted = false;
    bgm.play().then(() => {
      started = true;
      t0 = performance.now();
      hint.textContent = '♪ đang bật · nhấn để tắt';
    }).catch(() => { hint.textContent = '♪ không bật được nhạc'; });
  } else {
    bgm.muted = !bgm.muted;
    hint.textContent = bgm.muted ? '♪ đã tắt · nhấn để bật' : '♪ đang bật · nhấn để tắt';
  }
});

function frame(now) {
  // Khi nhạc đang chạy, lấy thời gian từ nhạc để hình luôn khớp tiếng
  const t = started && !bgm.paused ? bgm.currentTime % LOOP : ((now - t0) / 1000) % LOOP;
  draw(t);
  requestAnimationFrame(frame);
}
function start() {
  resize();
  if (still) draw(19); else requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { resize(); if (still) draw(19); });
start();
</script>
</body>
</html>
